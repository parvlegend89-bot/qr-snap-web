
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="QR SNAP - Free online QR code scanner.">
  <title>QR SNAP — Free QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      border-bottom: 1px solid #29354a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { font-size: 24px; font-weight: 800; }
    .logo span { color: #55e6c1; }

    .tag {
      color: #55e6c1;
      border: 1px solid #55e6c1;
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 12px;
    }

    main {
      width: min(600px, 92%);
      margin: 40px auto;
      text-align: center;
    }

    h1 { font-size: clamp(32px, 8vw, 48px); margin-bottom: 12px; }
    h1 span { color: #55e6c1; }

    .intro { color: #b6c2d5; line-height: 1.6; }

    .panel {
      margin-top: 28px;
      padding: 20px;
      background: #192538;
      border: 1px solid #30415a;
      border-radius: 22px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      color: #ffffff;
    }

    button, .upload-label {
      display: inline-block;
      padding: 13px 18px;
      margin: 7px 3px;
      border: 0;
      border-radius: 12px;
      background: #55e6c1;
      color: #101827;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .secondary {
      background: #293950;
      color: white;
    }

    #fileInput { display: none; }

    #status { color: #b6c2d5; font-size: 14px; margin: 15px 0; }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      text-align: left;
      border-radius: 14px;
      background: #101827;
      overflow-wrap: anywhere;
    }

    #resultText { white-space: pre-wrap; }

    a { color: #55e6c1; }
    footer { padding: 25px; text-align: center; color: #9aa9bf; font-size: 13px; }
  </style>
</head>

<body>
  <header>
    <div class="logo">QR <span>SNAP</span></div>
    <div class="tag">100% FREE</div>
  </header>

  <main>
    <h1>Scan smarter.<br><span>Scan instantly.</span></h1>
    <p class="intro">
      Scan QR codes with your camera or upload an image.
      Simple, fast and free.
    </p>

    <section class="panel">
      <div id="reader"></div>

      <button id="startButton" onclick="startScanner()">
        Open Camera
      </button>

      <label class="upload-label" for="fileInput">
        Scan an Image
      </label>
      <input id="fileInput" type="file" accept="image/*">

      <p id="status">Choose an option to begin scanning.</p>

      <div id="result">
        <strong>Scan result</strong>
        <p id="resultText"></p>
        <button class="secondary" onclick="copyResult()">Copy Result</button>
        <a id="openLink" href="#" target="_blank"
           rel="noopener noreferrer" hidden>Open Link</a>
      </div>
    </section>
  </main>

  <footer>
    QR SNAP © 2026 · Free QR scanning for everyone
  </footer>

  <script>
    const scanner = new Html5Qrcode("reader");
    let running = false;
    let lastResult = "";

    function showResult(text) {
      lastResult = text;
      document.getElementById("result").style.display = "block";
      document.getElementById("resultText").textContent = text;

      const link = document.getElementById("openLink");
      link.hidden = true;
      link.removeAttribute("href");

      try {
        const url = new URL(text);
        if (url.protocol === "https:" || url.protocol === "http:") {
          link.href = url.href;
          link.hidden = false;
        }
      } catch (_) {}

      document.getElementById("status").textContent = "QR code scanned successfully!";
    }

    async function startScanner() {
      const status = document.getElementById("status");
      const button = document.getElementById("startButton");

      button.disabled = true;
      status.textContent = "Starting camera...";

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          (text) => {
            showResult(text);
            if (running) {
              scanner.stop().catch(() => {});
              running = false;
              button.disabled = false;
              button.textContent = "Scan Again";
            }
          },
          () => {}
        );

        running = true;
        status.textContent = "Point your camera at a QR code.";
        button.textContent = "Camera Running";
      } catch (error) {
        status.textContent = "Camera unavailable. Allow camera permission or upload an image.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById("status").textContent = "Reading image...";

      try {
        const text = await scanner.scanFile(file, true);
        showResult(text);
      } catch (error) {
        document.getElementById("status").textContent =
          "No QR code found. Try a clearer image.";
      }

      event.target.value = "";
    });

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(lastResult);
        document.getElementById("status").textContent = "Result copied!";
      } catch (error) {
        document.getElementById("status").textContent =
          "Copy unavailable. Select and copy the result manually.";
      }
    }
  </script>
</body>
</html>
